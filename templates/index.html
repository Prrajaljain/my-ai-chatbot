<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Assistant | Prajal Jain</title>
    <!-- Google Fonts & CDN dependencies -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --gradient-glow: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(168, 85, 247, 0.3) 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --chat-user-bg: #4f46e5;
            --chat-bot-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            height: 94vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-glow {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--gradient-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .brand-info h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #a5b4fc;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        /* MESSAGES AREA */
        .chat-history {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        /* WELCOME BANNER */
        .welcome-box {
            text-align: center;
            margin: auto 0;
            padding: 40px 20px;
        }

        .welcome-icon {
            font-size: 50px;
            margin-bottom: 16px;
        }

        .welcome-box h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .welcome-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto 28px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .suggestion-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--bg-card-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        /* MESSAGE BUBBLES */
        .message-row {
            display: flex;
            gap: 14px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message-row.user .msg-avatar {
            background: var(--gradient-primary);
        }

        .message-row.assistant .msg-avatar {
            background: #334155;
            border: 1px solid var(--bg-card-border);
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .message-row.user .msg-bubble {
            background: var(--chat-user-bg);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }

        .message-row.assistant .msg-bubble {
            background: var(--chat-bot-bg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--bg-card-border);
        }

        /* MARKDOWN STYLES IN BUBBLE */
        .msg-bubble p { margin-bottom: 8px; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble pre {
            background: #090d16;
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .msg-bubble code {
            font-family: monospace;
            font-size: 0.85em;
        }

        /* TYPING INDICATOR */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* INPUT SECTION */
        .input-area {
            padding: 20px 28px;
            border-top: 1px solid var(--bg-card-border);
            background: rgba(15, 23, 42, 0.4);
        }

        .input-box-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 10px 14px;
            transition: border-color 0.2s;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--accent-purple);
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.2);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--gradient-primary);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* ALERT BAR */
        .alert-banner {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <div class="avatar-glow">🤖</div>
                <div class="brand-info">
                    <h1>Student AI Assistant</h1>
                    <p>Powered by Llama 3 & Hugging Face</p>
                </div>
            </div>
            <div class="badge">
                <span class="status-dot"></span>
                <span>Prajal Jain</span>
            </div>
        </header>

        <div class="chat-history" id="chatHistory">
            <div class="welcome-box" id="welcomeBox">
                <div class="welcome-icon">⚡</div>
                <h2>How can I help you today?</h2>
                <p>Ask anything about coding, studying, writing, or general problem solving.</p>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="usePrompt('Explain Python List Comprehension with an example')">💡 Explain Python List Comprehension</button>
                    <button class="suggestion-btn" onclick="usePrompt('Create a 7-day study plan for exams')">📅 7-Day Exam Study Plan</button>
                    <button class="suggestion-btn" onclick="usePrompt('How does machine learning work simply?')">🤖 Machine Learning 101</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="alert-banner" id="errorBanner"></div>
            <div class="input-box-wrapper">
                <textarea id="userInput" placeholder="Ask me a question..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="footer-text">Built with Llama 3 & Flask | Ready for Vercel Deployment</div>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeBox = document.getElementById('welcomeBox');
        const errorBanner = document.getElementById('errorBanner');

        let messageHistory = [];

        // Auto resize input textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function usePrompt(text) {
            userInput.value = text;
            sendMessage();
        }

        function showError(msg) {
            errorBanner.innerText = msg;
            errorBanner.style.display = 'block';
        }

        function hideError() {
            errorBanner.style.display = 'none';
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            hideError();

            if (welcomeBox) {
                welcomeBox.remove();
            }

            // Append User Message
            messageHistory.push({ role: 'user', content: text });
            appendMessageBubble('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Show Typing Indicator
            const typingElem = showTypingIndicator();
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                const data = await response.json();
                typingElem.remove();

                if (response.ok && data.answer) {
                    messageHistory.push({ role: 'assistant', content: data.answer });
                    appendMessageBubble('assistant', data.answer);
                } else {
                    const errText = data.error || 'Failed to generate response.';
                    showError(errText);
                }
            } catch (err) {
                typingElem.remove();
                showError('Network error. Please check your connection and try again.');
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function appendMessageBubble(role, content) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerText = role === 'user' ? '👤' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            if (role === 'assistant') {
                bubble.innerHTML = marked.parse(content);
                // Highlight code blocks
                bubble.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } else {
                bubble.innerText = content;
            }

            row.appendChild(avatar);
            row.appendChild(bubble);
            chatHistory.appendChild(row);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const row = document.createElement('div');
            row.className = 'message-row assistant';
            row.id = 'typingRow';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerText = '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;

            row.appendChild(avatar);
            row.appendChild(bubble);
            chatHistory.appendChild(row);
            scrollToBottom();
            return row;
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
